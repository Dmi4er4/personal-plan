buildscript {
  repositories { mavenCentral() }
  dependencies {
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}")
  }
}

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'expo.modules.planwidget'
version = '1.0.0'

expoModule { canBePublished false }

android {
  namespace "expo.modules.planwidget"
  buildFeatures { compose true }
  defaultConfig {
    minSdkVersion 24
    versionCode 1
    versionName "1.0.0"
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }
  testOptions { unitTests.includeAndroidResources = true }
}

dependencies {
  implementation "host.exp.exponent:expo.modules.backgroundtask:57.0.7"
  implementation "androidx.glance:glance-appwidget:1.1.1"
  implementation "androidx.glance:glance-material3:1.1.1"
  implementation "androidx.work:work-runtime-ktx:2.9.1"
  testImplementation "junit:junit:4.13.2"
  testImplementation "org.robolectric:robolectric:4.16.1"
  testImplementation "androidx.test:core:1.7.0"
  androidTestImplementation "androidx.test.ext:junit:1.2.1"
  androidTestImplementation "androidx.test:runner:1.6.2"
}

// Gradle 9 fails third-party Expo test tasks that contain sources but no tests
// discoverable by their legacy JUnit setup. Keep the aggregate qualification
// task usable while still executing and enforcing every discovered test.
gradle.projectsEvaluated {
  rootProject.allprojects {
    tasks.withType(Test).configureEach {
      failOnNoDiscoveredTests = false
    }
  }
}
import org.gradle.api.tasks.testing.Test
